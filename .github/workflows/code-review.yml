name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: TypeScript & Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # required by anthropics/claude-code-action to fetch OIDC token

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        # W13 Day 63: HARD blocker (previously continue-on-error).
        # tsc --noEmit ловит duplicate exports + type errors локально.
        # W12 «ghost-merge» incident случился потому что local SWC tolerated
        # duplicate replyToReview() но Vercel SWC ломал build silently
        # на каждый последующий merge. Tsc запрещает оба класса bug-ов.
        run: npx tsc --noEmit

      - name: Next.js build (SWC parity check)
        # W13 Day 63: catches SWC-level duplicate exports / module resolution
        # issues что tsc может пропустить. Same Next.js build что Vercel
        # запускает на prod — parity gate перед merge.
        run: npm run build
        env:
          # Build needs these for static prerender of public pages.
          # Provide empty placeholder if not set in secrets — most envs
          # have at minimum these two.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Claude Code Review
        # Optional review step. Requires the Claude Code GitHub App to be
        # installed on the repository (https://github.com/apps/claude).
        # Marked continue-on-error so a missing install doesn't block PRs.
        continue-on-error: true
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          direct_prompt: |
            You are a senior TypeScript/Next.js engineer reviewing a PR for the ProForm project.

            Project context:
            - Next.js 14, TypeScript, Supabase, Metronic Tailwind v4
            - DB: table `users` (NOT `profiles`), `calendar_events` uses `owner_id`, `workouts` uses `athlete_id`
            - RLS policies use `get_my_user_id()` function
            - Roles: athlete | coach | organization | admin

            Review priorities:
            1. CRITICAL — Security: XSS, SQL injection, hardcoded secrets, exposed env vars
            2. HIGH — Type safety: `any` without justification, missing types, unsafe casts
            3. HIGH — Async: unhandled rejections, missing await, floating promises
            4. HIGH — Supabase: wrong column names (user_id vs owner_id vs athlete_id), missing RLS, no NOTIFY after migration
            5. MEDIUM — React/Next.js: missing deps in useEffect, state mutation, key={index}
            6. MEDIUM — Performance: N+1 queries, expensive renders without memo

            Format your review as:
            - 🔴 CRITICAL / 🟠 HIGH / 🟡 MEDIUM / 🟢 OK
            - File + line number for each issue
            - Short explanation + suggested fix

            End with: **Verdict: ✅ Approve / ⚠️ Approve with warnings / 🚫 Block**
